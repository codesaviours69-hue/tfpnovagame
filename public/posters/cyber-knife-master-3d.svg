<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="knifeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0d0824"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="targetLog" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="cyanBlade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#knifeBg)"/>

  <!-- Rotating Neon Target Disc in Center -->
  <g transform="translate(400, 190)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="90" fill="url(#targetLog)" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="8,8"/>
    <circle cx="0" cy="0" r="30" fill="#00f0ff" opacity="0.3"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff"/>

    <!-- Embedded Knives around the Target -->
    <g transform="rotate(30) translate(0, -90)">
      <polygon points="0,-35 6,0 -6,0" fill="url(#cyanBlade)" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="-3" y="0" width="6" height="16" rx="2" fill="#0f172a"/>
    </g>
    <g transform="rotate(110) translate(0, -90)">
      <polygon points="0,-35 6,0 -6,0" fill="url(#cyanBlade)" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="-3" y="0" width="6" height="16" rx="2" fill="#0f172a"/>
    </g>
    <g transform="rotate(220) translate(0, -90)">
      <polygon points="0,-35 6,0 -6,0" fill="url(#cyanBlade)" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="-3" y="0" width="6" height="16" rx="2" fill="#0f172a"/>
    </g>

    <!-- Glowing Cyber Apple Bonus -->
    <g transform="rotate(-60) translate(0, -90)">
      <circle cx="0" cy="0" r="14" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

  <!-- Flying Neon Knife in Motion -->
  <g transform="translate(400, 360)" filter="url(#neonGlow)">
    <!-- Motion Speed Trails -->
    <line x1="0" y1="40" x2="0" y2="10" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="-8" y1="45" x2="-8" y2="25" stroke="#f43f5e" stroke-width="2"/>
    <line x1="8" y1="45" x2="8" y2="25" stroke="#f43f5e" stroke-width="2"/>

    <!-- Knife Blade -->
    <polygon points="0,-45 9,0 -9,0" fill="url(#cyanBlade)" stroke="#ffffff" stroke-width="2"/>
    <rect x="-4" y="0" width="8" height="20" rx="3" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5"/>
  </g>

  <!-- Spark Particles -->
  <g fill="#ffe600" filter="url(#neonGlow)">
    <circle cx="370" cy="110" r="4"/>
    <circle cx="440" cy="100" r="5"/>
    <circle cx="480" cy="180" r="3.5"/>
    <circle cx="330" cy="220" r="4.5"/>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(400, 46)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="3" filter="url(#neonGlow)">CYBER KNIFE MASTER 3D</text>
    <text x="0" y="22" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="4">TARGET HIT • BOSS BATTLES • UNLOCKABLE BLADES</text>
  </g>
</svg>
