<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="mergeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#080e2a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cube2048" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="cube1024" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="cube512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#mergeBg)"/>

  <!-- Arena Container -->
  <rect x="220" y="50" width="360" height="360" rx="18" fill="#0f172a" fill-opacity="0.7" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Isometric Numbered Cubes Inside Arena -->
  <g filter="url(#neonGlow)">
    <!-- 2048 Glowing Giant Cube (Center) -->
    <g transform="translate(400, 160)">
      <rect x="-35" y="-35" width="70" height="70" rx="12" fill="url(#cube2048)" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="10" fill="#ffffff" font-family="system-ui, monospace" font-weight="900" font-size="22" text-anchor="middle">2048</text>
    </g>

    <!-- 1024 Cube (Left) -->
    <g transform="translate(300, 190)">
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="url(#cube1024)" stroke="#ffffff" stroke-width="1.5"/>
      <text x="0" y="8" fill="#ffffff" font-family="system-ui, monospace" font-weight="900" font-size="18" text-anchor="middle">1024</text>
    </g>

    <!-- 512 Cube (Right) -->
    <g transform="translate(490, 190)">
      <rect x="-28" y="-28" width="56" height="56" rx="10" fill="url(#cube512)" stroke="#ffffff" stroke-width="1.5"/>
      <text x="0" y="7" fill="#ffffff" font-family="system-ui, monospace" font-weight="900" font-size="18" text-anchor="middle">512</text>
    </g>
  </g>

  <!-- Laser Trajectory Aim Line -->
  <line x1="400" y1="365" x2="400" y2="240" stroke="#00f0ff" stroke-width="3" stroke-dasharray="6,6" filter="url(#neonGlow)"/>

  <!-- Ready Cannon Cube at Bottom -->
  <g transform="translate(400, 365)" filter="url(#neonGlow)">
    <rect x="-28" y="-28" width="56" height="56" rx="10" fill="url(#cube2048)" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="8" fill="#ffffff" font-family="system-ui, monospace" font-weight="900" font-size="18" text-anchor="middle">2048</text>
  </g>

  <!-- Merging Spark Shockwaves -->
  <g fill="#ffe600" filter="url(#neonGlow)">
    <circle cx="370" cy="120" r="4"/>
    <circle cx="430" cy="110" r="5"/>
    <circle cx="340" cy="160" r="3.5"/>
    <circle cx="460" cy="150" r="4.5"/>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(400, 44)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="30" letter-spacing="3" filter="url(#neonGlow)">CYBER 2048 CUBE MERGE</text>
    <text x="0" y="20" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="4">CHAIN CUBE 3D • SHOOT & MERGE • INFINITE 4096+</text>
  </g>
</svg>
