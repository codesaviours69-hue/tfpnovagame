<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />

  <!-- Grid in background -->
  <path d="M 0 350 L 400 350 M 0 400 L 400 400 M 0 450 L 400 450" stroke="#00f0ff" stroke-width="1" opacity="0.15" />

  <!-- Floating Zigzag Road Segments -->
  <!-- Segment 1 (Going Top-Right to Center) -->
  <polygon points="120,440 280,300 340,330 180,470" fill="#0f172a" stroke="#00f0ff" stroke-width="3" filter="drop-shadow(0 0 15px rgba(0,240,255,0.4))" />
  <!-- Road Edge Glow -->
  <line x1="280" y1="300" x2="340" y2="330" stroke="#f43f5e" stroke-width="4" filter="drop-shadow(0 0 10px rgba(244,63,94,0.8))" />
  
  <!-- Segment 2 (Corner Turn to Top-Left) -->
  <polygon points="280,300 340,330 200,180 140,150" fill="#0f172a" stroke="#00f0ff" stroke-width="3" />
  
  <!-- Segment 3 (Next Turn Up-Right) -->
  <polygon points="140,150 200,180 320,60 260,30" fill="#0f172a" stroke="#00f0ff" stroke-width="3" opacity="0.7" />

  <!-- Tire Smoke & Drift Skid Marks -->
  <path d="M 220,380 Q 280,320 270,270" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" opacity="0.6" filter="drop-shadow(0 0 10px #00f0ff)" />
  <path d="M 250,400 Q 300,340 290,290" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" opacity="0.6" filter="drop-shadow(0 0 10px #f43f5e)" />

  <!-- Drift Smoke Clouds -->
  <circle cx="280" cy="310" r="18" fill="#ffffff" opacity="0.25" filter="blur(6px)" />
  <circle cx="300" cy="330" r="24" fill="#00f0ff" opacity="0.2" filter="blur(8px)" />

  <!-- 3D Drifting Supercar -->
  <g transform="translate(240, 260) rotate(35)">
    <!-- Shadow -->
    <ellipse cx="0" cy="10" rx="35" ry="18" fill="#000000" opacity="0.6" />
    
    <!-- Wheels -->
    <rect x="-32" y="-22" width="12" height="18" rx="4" fill="#020617" stroke="#00f0ff" stroke-width="1.5" />
    <rect x="20" y="-22" width="12" height="18" rx="4" fill="#020617" stroke="#00f0ff" stroke-width="1.5" />
    <rect x="-32" y="6" width="12" height="18" rx="4" fill="#020617" stroke="#00f0ff" stroke-width="1.5" />
    <rect x="20" y="6" width="12" height="18" rx="4" fill="#020617" stroke="#00f0ff" stroke-width="1.5" />

    <!-- Car Body -->
    <rect x="-30" y="-20" width="60" height="38" rx="10" fill="url(#carGrad)" stroke="#facc15" stroke-width="2" filter="drop-shadow(0 0 15px rgba(244,63,94,0.7))" />
    <!-- Cockpit Glass -->
    <rect x="-14" y="-14" width="28" height="26" rx="6" fill="#0284c7" opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Spoiler -->
    <rect x="-28" y="14" width="56" height="6" rx="2" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" />
    <!-- Headlights Glow -->
    <circle cx="-16" cy="-20" r="5" fill="#facc15" filter="drop-shadow(0 0 8px #facc15)" />
    <circle cx="16" cy="-20" r="5" fill="#facc15" filter="drop-shadow(0 0 8px #facc15)" />
  </g>

  <!-- Floating Coins -->
  <g transform="translate(180, 160)">
    <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#eab308" stroke-width="2" filter="drop-shadow(0 0 10px rgba(250,204,21,0.8))" />
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#78350f" text-anchor="middle">★</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(200, 70)">
    <rect x="-140" y="-35" width="280" height="70" rx="16" fill="#090d16" fill-opacity="0.9" stroke="#f43f5e" stroke-width="2" filter="url(#neonGlow)" />
    <text x="0" y="-6" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">NEON DRIFT BOSS</text>
    <text x="0" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f43f5e" text-anchor="middle" letter-spacing="3">ONE-TAP SLING DRIFTER</text>
  </g>
</svg>
