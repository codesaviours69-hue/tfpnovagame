<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="watermelonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <radialGradient id="melonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="70%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </radialGradient>
    <radialGradient id="pineappleGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>
    <radialGradient id="peachGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="70%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <radialGradient id="grapeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#581c87"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Glass Jar Drop Container -->
  <rect x="220" y="80" width="360" height="340" rx="20" fill="none" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)"/>
  <rect x="220" y="80" width="360" height="340" rx="20" fill="#0f172a" fill-opacity="0.6"/>

  <!-- Danger Line at Top of Jar -->
  <line x1="220" y1="130" x2="580" y2="130" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Giant Giant Watermelon at the Bottom -->
  <g transform="translate(400, 320)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="85" fill="url(#watermelonGrad)"/>
    <!-- Watermelon Stripes -->
    <path d="M-60,-60 Q-20,0 -60,60" stroke="#022c22" stroke-width="8" fill="none"/>
    <path d="M-20,-80 Q10,0 -20,80" stroke="#022c22" stroke-width="8" fill="none"/>
    <path d="M25,-80 Q50,0 25,80" stroke="#022c22" stroke-width="8" fill="none"/>
    <path d="M65,-55 Q90,0 65,55" stroke="#022c22" stroke-width="8" fill="none"/>
    <!-- Cute Eyes & Smile -->
    <circle cx="-25" cy="-15" r="7" fill="#ffffff"/>
    <circle cx="-25" cy="-15" r="4" fill="#020617"/>
    <circle cx="25" cy="-15" r="7" fill="#ffffff"/>
    <circle cx="25" cy="-15" r="4" fill="#020617"/>
    <path d="M-12,12 Q0,26 12,12" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Surrounding Bouncing Neon Fruits -->
  <!-- Honeydew Melon -->
  <g transform="translate(290, 240)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="50" fill="url(#melonGrad)"/>
    <circle cx="-14" cy="-8" r="4" fill="#ffffff"/>
    <circle cx="14" cy="-8" r="4" fill="#ffffff"/>
  </g>

  <!-- Pineapple -->
  <g transform="translate(505, 235)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="45" fill="url(#pineappleGrad)"/>
    <circle cx="-12" cy="-6" r="4" fill="#020617"/>
    <circle cx="12" cy="-6" r="4" fill="#020617"/>
  </g>

  <!-- Peach -->
  <g transform="translate(400, 190)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="35" fill="url(#peachGrad)"/>
    <circle cx="-8" cy="-5" r="3" fill="#ffffff"/>
    <circle cx="8" cy="-5" r="3" fill="#ffffff"/>
  </g>

  <!-- Grapes & Strawberry Dropping -->
  <g transform="translate(340, 150)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="22" fill="url(#grapeGrad)"/>
  </g>
  <g transform="translate(460, 145)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="16" fill="#f43f5e"/>
  </g>

  <!-- Merge Particle Sparks -->
  <g fill="#ffe600" filter="url(#neonGlow)">
    <circle cx="370" cy="220" r="3.5"/>
    <circle cx="440" cy="210" r="4.5"/>
    <circle cx="410" cy="150" r="3"/>
  </g>

  <!-- Top Header Title -->
  <g transform="translate(400, 46)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="3" filter="url(#neonGlow)">CYBER SUIKA: WATERMELON MERGE</text>
    <text x="0" y="22" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="4">PHYSICS DROP • CHAIN REACTION • MERGE 2048</text>
  </g>
</svg>
