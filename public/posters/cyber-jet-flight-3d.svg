<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05030a"/>
      <stop offset="50%" stop-color="#14062b"/>
      <stop offset="100%" stop-color="#2d0847"/>
    </linearGradient>

    <!-- Neon Ring Glow Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ffea00"/>
    </linearGradient>

    <!-- Jet Metallic Gradient -->
    <linearGradient id="jetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Synthwave Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- City Skyline Silhouette at Horizon -->
  <path d="M0,600 L0,480 L40,480 L40,420 L70,420 L70,480 L120,480 L120,380 L160,380 L160,480 L220,480 L220,440 L260,440 L260,600 Z" fill="#090412" opacity="0.8"/>
  <path d="M540,600 L540,450 L580,450 L580,390 L630,390 L630,500 L710,500 L710,430 L760,430 L760,600 Z" fill="#090412" opacity="0.8"/>

  <!-- Grid Perspective Floor -->
  <g stroke="#00f2fe" stroke-width="1.5" opacity="0.3">
    <line x1="0" y1="520" x2="800" y2="520"/>
    <line x1="0" y1="550" x2="800" y2="550"/>
    <line x1="0" y1="580" x2="800" y2="580"/>
    <line x1="400" y1="450" x2="-200" y2="600"/>
    <line x1="400" y1="450" x2="200" y2="600"/>
    <line x1="400" y1="450" x2="600" y2="600"/>
    <line x1="400" y1="450" x2="1000" y2="600"/>
  </g>

  <!-- Glowing Neon Flight Rings in Perspective -->
  <!-- Ring 1 (Distant) -->
  <ellipse cx="400" cy="280" rx="60" ry="80" fill="none" stroke="#ff007f" stroke-width="6" filter="url(#neonGlow)" opacity="0.6"/>
  <!-- Ring 2 (Mid-distance) -->
  <ellipse cx="380" cy="310" rx="100" ry="130" fill="none" stroke="#00f2fe" stroke-width="10" filter="url(#neonGlow)" opacity="0.85"/>
  <!-- Ring 3 (Foreground Gate) -->
  <ellipse cx="420" cy="330" rx="170" ry="210" fill="none" stroke="url(#ringGrad)" stroke-width="14" filter="url(#neonGlow)"/>

  <!-- 3D Cyber Fighter Jet Banking Through the Ring -->
  <g transform="translate(420, 310) rotate(-18)">
    <!-- Thruster Laser Trail -->
    <path d="M0,50 L-30,180 L30,180 Z" fill="#00f2fe" filter="url(#neonGlow)" opacity="0.85"/>
    <path d="M0,50 L-10,130 L10,130 Z" fill="#ffffff" filter="url(#neonGlow)"/>

    <!-- Left Wing -->
    <polygon points="0,0 -160,50 -130,70 0,30" fill="#00f2fe" filter="url(#neonGlow)"/>
    <polygon points="0,0 -150,45 -120,65 0,25" fill="url(#jetGrad)"/>

    <!-- Right Wing -->
    <polygon points="0,0 160,50 130,70 0,30" fill="#00f2fe" filter="url(#neonGlow)"/>
    <polygon points="0,0 150,45 120,65 0,25" fill="url(#jetGrad)"/>

    <!-- Fuselage Main Body -->
    <polygon points="0,-90 -22,20 -15,50 15,50 22,20" fill="url(#jetGrad)" stroke="#00f2fe" stroke-width="2"/>

    <!-- Cockpit Canopy Glow -->
    <ellipse cx="0" cy="-25" rx="12" ry="30" fill="#ff007f" filter="url(#neonGlow)"/>
    <ellipse cx="0" cy="-25" rx="7" ry="20" fill="#ffffff" opacity="0.7"/>

    <!-- Twin Tail Fins -->
    <polygon points="-12,30 -25,10 -25,50" fill="#ff007f" filter="url(#neonGlow)"/>
    <polygon points="12,30 25,10 25,50" fill="#ff007f" filter="url(#neonGlow)"/>
  </g>

  <!-- Title Banner -->
  <text x="400" y="85" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="46" fill="#ffffff" filter="url(#neonGlow)" letter-spacing="4">
    CYBER JET FLIGHT
  </text>
  <text x="400" y="135" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="36" fill="#00f2fe" filter="url(#neonGlow)" letter-spacing="8">
    3D SIMULATOR
  </text>
</svg>
