<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="stadiumSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="pitchLight" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="electricBall" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky & Stadium Background -->
  <rect width="800" height="450" fill="url(#stadiumSky)"/>

  <!-- Stadium Floodlights Glow -->
  <g opacity="0.4">
    <polygon points="60,0 20,40 380,450 480,450" fill="url(#pitchLight)"/>
    <polygon points="740,0 780,40 420,450 320,450" fill="url(#pitchLight)"/>
  </g>

  <!-- Stadium Oval Outfield -->
  <ellipse cx="400" cy="310" rx="360" ry="130" fill="#022c22" stroke="#00f0ff" stroke-width="2" opacity="0.9"/>
  <ellipse cx="400" cy="310" rx="300" ry="105" fill="#064e3b" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- 22-Yard Cricket Pitch (Turf) -->
  <polygon points="360,240 440,240 460,390 340,390" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <line x1="345" y1="365" x2="455" y2="365" stroke="#ffffff" stroke-width="2.5"/> <!-- Batting Crease -->
  <line x1="362" y1="260" x2="438" y2="260" stroke="#ffffff" stroke-width="2"/> <!-- Bowling Crease -->

  <!-- LED Stumps & Bails -->
  <g stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)">
    <line x1="388" y1="360" x2="388" y2="320"/>
    <line x1="400" y1="360" x2="400" y2="320"/>
    <line x1="412" y1="360" x2="412" y2="320"/>
    <line x1="385" y1="320" x2="415" y2="320" stroke="#ffe600" stroke-width="3"/>
  </g>

  <!-- Batsman Silhouette with Glowing Neon Bat -->
  <g transform="translate(420, 280)">
    <!-- Neon Bat Swing Arc -->
    <path d="M-10,20 Q40,-20 80,-40" stroke="#00f0ff" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#neonGlow)"/>
    <path d="M-10,20 Q40,-20 80,-40" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Smashed Electric Cricket Ball with Comet Trail -->
  <g filter="url(#neonGlow)">
    <path d="M470,260 Q560,180 660,100" stroke="#ff007f" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
    <circle cx="660" cy="100" r="16" fill="url(#electricBall)"/>
    <circle cx="660" cy="100" r="22" fill="none" stroke="#ffe600" stroke-width="2"/>
  </g>

  <!-- Particle Impact Sparks -->
  <g fill="#ffe600" filter="url(#neonGlow)">
    <circle cx="480" cy="250" r="3"/>
    <circle cx="500" cy="235" r="4"/>
    <circle cx="465" cy="270" r="2.5"/>
    <circle cx="520" cy="210" r="3"/>
  </g>

  <!-- Top Banner -->
  <g transform="translate(400, 55)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="3" filter="url(#neonGlow)">CYBER CRICKET PRO: WORLD LEAGUE</text>
    <text x="0" y="24" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="4">NATIONS • PLAYING XI • VENUE • WEATHER • COIN TOSS</text>
  </g>
</svg>
