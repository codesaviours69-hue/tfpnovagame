<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="mobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="gateBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="mobGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#mobBg)"/>
  
  <!-- Perspective 3D Runway Grid -->
  <polygon points="260,140 540,140 760,450 40,450" fill="#090d16" stroke="#00f0ff" stroke-width="2"/>
  <line x1="400" y1="140" x2="400" y2="450" stroke="#00f0ff" stroke-width="2" stroke-dasharray="16 12" stroke-opacity="0.6"/>
  <line x1="330" y1="140" x2="220" y2="450" stroke="#334155" stroke-width="1.5"/>
  <line x1="470" y1="140" x2="580" y2="450" stroke="#334155" stroke-width="1.5"/>

  <!-- Multiplier Math Gates on Runway -->
  <!-- Left Gate [x5] -->
  <g transform="translate(280, 200)" filter="url(#mobGlow)">
    <rect x="-60" y="-45" width="120" height="70" rx="12" fill="#0284c7" fill-opacity="0.5" stroke="#00f0ff" stroke-width="3"/>
    <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="32" text-anchor="middle">x5</text>
  </g>
  <!-- Right Gate [+50] -->
  <g transform="translate(520, 200)" filter="url(#mobGlow)">
    <rect x="-60" y="-45" width="120" height="70" rx="12" fill="#7c3aed" fill-opacity="0.5" stroke="#c084fc" stroke-width="3"/>
    <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="32" text-anchor="middle">+50</text>
  </g>

  <!-- Giant Swarm of Cyan Cyber Runners -->
  <g transform="translate(400, 340)" filter="url(#mobGlow)">
    <!-- Swarm Cluster Units -->
    <circle cx="-90" cy="20" r="14" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-60" cy="0" r="15" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-40" cy="30" r="16" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-20" cy="10" r="17" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="19" fill="#00f0ff" stroke="#ffffff" stroke-width="3"/>
    <circle cx="20" cy="15" r="17" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="40" cy="30" r="16" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="60" cy="5" r="15" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="90" cy="20" r="14" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-30" cy="-25" r="14" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="-30" r="15" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="30" cy="-25" r="14" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>

    <!-- Mob Count Badge Above Swarm -->
    <rect x="-40" y="-70" width="80" height="30" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="2"/>
    <text x="0" y="-50" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="900" font-size="18" text-anchor="middle">128</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 50)" text-anchor="middle">
    <rect x="-260" y="-25" width="520" height="42" rx="12" fill="#0891b2" fill-opacity="0.6" stroke="#22d3ee" stroke-width="2" filter="url(#mobGlow)"/>
    <text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="24" letter-spacing="3" text-anchor="middle">CYBER MOB RUNNER 3D</text>
  </g>
</svg>
