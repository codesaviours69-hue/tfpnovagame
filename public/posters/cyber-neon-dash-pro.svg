<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f0728"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cubeFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="spikeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#dashBg)"/>

  <!-- Neon Grid Floor -->
  <line x1="0" y1="360" x2="800" y2="360" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)"/>
  <rect x="0" y="360" width="800" height="90" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Glowing Neon Spikes -->
  <g filter="url(#neonGlow)">
    <polygon points="340,360 365,300 390,360" fill="url(#spikeGrad)" stroke="#ffffff" stroke-width="2"/>
    <polygon points="390,360 415,300 440,360" fill="url(#spikeGrad)" stroke="#ffffff" stroke-width="2"/>
    <polygon points="440,360 465,300 490,360" fill="url(#spikeGrad)" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Glowing Jump Ring (Yellow Jump Orb) -->
  <g transform="translate(415, 220)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#facc15" stroke-width="4"/>
    <circle cx="0" cy="0" r="14" fill="#fde047"/>
  </g>

  <!-- Jumping Cyber Cube Hero (Mid-air flip over spikes) -->
  <g transform="translate(250, 240) rotate(45)" filter="url(#neonGlow)">
    <rect x="-35" y="-35" width="70" height="70" rx="10" fill="url(#cubeFace)" stroke="#ffffff" stroke-width="3"/>
    <!-- Cyber Face Eyes & Mouth -->
    <rect x="-18" y="-12" width="10" height="10" rx="2" fill="#020617"/>
    <rect x="8" y="-12" width="10" height="10" rx="2" fill="#020617"/>
    <rect x="-12" y="10" width="24" height="6" rx="2" fill="#020617"/>
  </g>

  <!-- Speed Motion Trails -->
  <g filter="url(#neonGlow)">
    <path d="M100,240 L220,240" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M120,220 L210,220" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M80,260 L200,260" stroke="#facc15" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Floating Spark Particles -->
  <g fill="#ffe600" filter="url(#neonGlow)">
    <circle cx="280" cy="210" r="4"/>
    <circle cx="310" cy="270" r="5"/>
    <circle cx="230" cy="290" r="3.5"/>
    <circle cx="520" cy="250" r="4.5"/>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(400, 48)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="3" filter="url(#neonGlow)">CYBER NEON DASH PRO</text>
    <text x="0" y="22" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="4">GEOMETRY RHYTHM RUNNER • INSTANT RESPAWN • 100%</text>
  </g>
</svg>
