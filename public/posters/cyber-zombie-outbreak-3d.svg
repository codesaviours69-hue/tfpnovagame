<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="40%" stop-color="#091428"/>
      <stop offset="70%" stop-color="#190924"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyperGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Acid Green Zombie Glow -->
    <radialGradient id="acidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#15803d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </radialGradient>

    <!-- Laser Fire Gradient -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Muzzle Flash Gradient -->
    <radialGradient id="muzzleFlash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Cyber Metropolis Ruins in Mist -->
  <g opacity="0.35">
    <rect x="30" y="120" width="75" height="340" fill="#090d16" stroke="#00f0ff" stroke-width="1.5"/>
    <rect x="120" y="80" width="90" height="380" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
    <rect x="230" y="150" width="60" height="310" fill="#090d16" stroke="#ef4444" stroke-width="1"/>
    <rect x="520" y="100" width="80" height="360" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
    <rect x="620" y="130" width="95" height="330" fill="#090d16" stroke="#a855f7" stroke-width="1"/>
    <rect x="730" y="90" width="55" height="370" fill="#090d16" stroke="#22c55e" stroke-width="1"/>
  </g>

  <!-- Toxic Biohazard Fog Glow on Ground -->
  <circle cx="260" cy="460" r="160" fill="url(#acidGlow)" filter="url(#hyperGlow)"/>
  <circle cx="600" cy="480" r="180" fill="url(#acidGlow)" filter="url(#hyperGlow)"/>

  <!-- Isometric Ground Grid with Blood & Slime Puddles -->
  <polygon points="50,580 750,580 620,380 180,380" fill="#0a0f1d" stroke="#22c55e" stroke-width="2" opacity="0.8"/>
  <ellipse cx="280" cy="480" rx="45" ry="16" fill="#15803d" opacity="0.7" filter="url(#neonGlow)"/>
  <ellipse cx="540" cy="490" rx="60" ry="20" fill="#991b1b" opacity="0.8" filter="url(#neonGlow)"/>

  <!-- Left: Cyber Zombie Horde Swarming (Silhouette + Glowing Green Eyes) -->
  <g transform="translate(180, 420)">
    <!-- Zombie 1 (Crawler) -->
    <ellipse cx="-40" cy="40" rx="35" ry="12" fill="#000000" opacity="0.6"/>
    <circle cx="-40" cy="15" r="16" fill="#166534" stroke="#22c55e" stroke-width="2"/>
    <circle cx="-45" cy="12" r="3" fill="#4ade80" filter="url(#neonGlow)"/>
    <circle cx="-35" cy="12" r="3" fill="#4ade80" filter="url(#neonGlow)"/>
    <path d="M -40,30 L -65,50 M -40,30 L -15,50" stroke="#166534" stroke-width="6" stroke-linecap="round"/>

    <!-- Zombie 2 (Fast Stalker) -->
    <ellipse cx="20" cy="35" rx="30" ry="10" fill="#000000" opacity="0.6"/>
    <circle cx="20" cy="-5" r="18" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <circle cx="15" cy="-8" r="3.5" fill="#ef4444" filter="url(#neonGlow)"/>
    <circle cx="25" cy="-8" r="3.5" fill="#ef4444" filter="url(#neonGlow)"/>
    <path d="M 20,12 L 5,45 M 20,12 L 35,45" stroke="#14532d" stroke-width="7" stroke-linecap="round"/>

    <!-- Zombie 3 (Armored Goliath Boss in Back) -->
    <circle cx="-10" cy="-60" r="32" fill="#052e16" stroke="#22c55e" stroke-width="3" filter="url(#neonGlow)"/>
    <circle cx="-18" cy="-65" r="6" fill="#facc15" filter="url(#hyperGlow)"/>
    <circle cx="-2" cy="-65" r="6" fill="#facc15" filter="url(#hyperGlow)"/>
    <!-- Cybernetic Horns/Implants -->
    <polygon points="-32,-85 -20,-75 -35,-65" fill="#ef4444" filter="url(#neonGlow)"/>
    <polygon points="12,-85 0,-75 15,-65" fill="#ef4444" filter="url(#neonGlow)"/>
  </g>

  <!-- Right: More Cyber Mutants -->
  <g transform="translate(620, 430)">
    <circle cx="-30" cy="5" r="17" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <circle cx="-36" cy="2" r="3" fill="#4ade80" filter="url(#neonGlow)"/>
    <circle cx="-24" cy="2" r="3" fill="#4ade80" filter="url(#neonGlow)"/>
    <circle cx="25" cy="-20" r="22" fill="#0f291e" stroke="#ef4444" stroke-width="2"/>
    <circle cx="18" cy="-25" r="4" fill="#ef4444" filter="url(#neonGlow)"/>
    <circle cx="32" cy="-25" r="4" fill="#ef4444" filter="url(#neonGlow)"/>
  </g>

  <!-- CENTER: CYBER COMMANDO HERO (Aiming Dual Plasma Guns & Firing Lasers) -->
  <g transform="translate(400, 440)">
    <!-- Hero Shadow -->
    <ellipse cx="0" cy="35" rx="45" ry="14" fill="#000000" opacity="0.8"/>

    <!-- Plasma Shield Bubble -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.75" stroke-dasharray="10 6" filter="url(#hyperGlow)"/>

    <!-- Body Armored Suit -->
    <polygon points="-16,25 -22,0 0,-15 22,0 16,25" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-14" y="2" width="28" height="18" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>

    <!-- Glowing Cyber Visor Helmet -->
    <circle cx="0" cy="-22" r="16" fill="#050b14" stroke="#00f0ff" stroke-width="2"/>
    <rect x="-11" y="-25" width="22" height="7" rx="3" fill="#00f0ff" filter="url(#neonGlow)"/>

    <!-- Left Arm & Plasma Blaster (Firing Left) -->
    <line x1="-18" y1="-5" x2="-45" y2="-12" stroke="#0284c7" stroke-width="7" stroke-linecap="round"/>
    <rect x="-65" y="-18" width="24" height="10" rx="3" fill="#1e293b" stroke="#00f0ff" stroke-width="2"/>
    <!-- Left Muzzle Flash -->
    <circle cx="-70" cy="-13" r="14" fill="url(#muzzleFlash)" filter="url(#hyperGlow)"/>

    <!-- Right Arm & Heavy Minigun (Firing Right) -->
    <line x1="18" y1="-5" x2="48" y2="-10" stroke="#0284c7" stroke-width="7" stroke-linecap="round"/>
    <rect x="45" y="-18" width="30" height="14" rx="3" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
    <!-- Right Muzzle Flash -->
    <circle cx="80" cy="-11" r="16" fill="url(#muzzleFlash)" filter="url(#hyperGlow)"/>
  </g>

  <!-- High-Energy Laser Beams Blasting Left & Right into Zombies -->
  <path d="M 330,427 L 160,390" stroke="url(#laserBeam)" stroke-width="6" stroke-linecap="round" filter="url(#hyperGlow)"/>
  <path d="M 480,429 L 660,400" stroke="#facc15" stroke-width="6" stroke-linecap="round" filter="url(#hyperGlow)"/>
  <path d="M 480,432 L 680,440" stroke="#ef4444" stroke-width="4" stroke-linecap="round" filter="url(#hyperGlow)"/>

  <!-- Sentry Turret Deployable (Foreground) -->
  <g transform="translate(470, 500)">
    <polygon points="-16,10 0,-5 16,10 0,15" fill="#334155" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="0" cy="-10" r="12" fill="#0f172a" stroke="#00f0ff" stroke-width="2"/>
    <rect x="0" y="-14" width="22" height="8" rx="2" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
    <circle cx="24" cy="-10" r="6" fill="#facc15" filter="url(#neonGlow)"/>
  </g>

  <!-- SURVIVORS / WAVE 50 BADGE OVERLAY -->
  <g transform="translate(400, 65)">
    <!-- Header Glow Plate -->
    <rect x="-180" y="-24" width="360" height="48" rx="24" fill="#030712" fill-opacity="0.9" stroke="#22c55e" stroke-width="2.5" filter="url(#neonGlow)"/>
    <text x="0" y="8" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" fill="#22c55e" text-anchor="middle" letter-spacing="4" filter="url(#hyperGlow)">BIOHAZARD WAVE 50</text>
  </g>

  <!-- TITLE TYPOGRAPHY -->
  <g transform="translate(400, 145)">
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="50" fill="#22c55e" text-anchor="middle" letter-spacing="6" opacity="0.6" filter="url(#hyperGlow)">CYBER ZOMBIE OUTBREAK</text>
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="50" fill="#ffffff" text-anchor="middle" letter-spacing="6">CYBER ZOMBIE OUTBREAK</text>
    <rect x="-140" y="10" width="280" height="26" rx="13" fill="#ef4444" filter="url(#neonGlow)"/>
    <text x="0" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="4">3D NEON SURVIVAL</text>
  </g>
</svg>
