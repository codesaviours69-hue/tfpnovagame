<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="alleyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="laneWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="bowlingBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="90%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Alley Background -->
  <rect width="800" height="450" fill="url(#alleyBg)"/>

  <!-- 3D Perspective Bowling Lane -->
  <polygon points="320,120 480,120 620,450 180,450" fill="url(#laneWood)" stroke="#00f0ff" stroke-width="2"/>

  <!-- Neon Side Gutters -->
  <polygon points="280,120 320,120 180,450 120,450" fill="#0f172a" stroke="#ff007f" stroke-width="1.5"/>
  <polygon points="480,120 520,120 680,450 620,450" fill="#0f172a" stroke="#ff007f" stroke-width="1.5"/>

  <!-- Pin Deck with 10 Glowing Bowling Pins -->
  <g transform="translate(400, 140)" filter="url(#neonGlow)">
    <!-- Back Row 4 Pins -->
    <ellipse cx="-45" cy="-20" rx="6" ry="14" fill="#ffffff" stroke="#ff007f" stroke-width="1.5"/>
    <ellipse cx="-15" cy="-20" rx="6" ry="14" fill="#ffffff" stroke="#ff007f" stroke-width="1.5"/>
    <ellipse cx="15" cy="-20" rx="6" ry="14" fill="#ffffff" stroke="#ff007f" stroke-width="1.5"/>
    <ellipse cx="45" cy="-20" rx="6" ry="14" fill="#ffffff" stroke="#ff007f" stroke-width="1.5"/>

    <!-- Row 3 Pins -->
    <ellipse cx="-30" cy="-5" rx="7" ry="16" fill="#ffffff" stroke="#ff007f" stroke-width="1.5"/>
    <ellipse cx="0" cy="-5" rx="7" ry="16" fill="#ffffff" stroke="#ff007f" stroke-width="1.5"/>
    <ellipse cx="30" cy="-5" rx="7" ry="16" fill="#ffffff" stroke="#ff007f" stroke-width="1.5"/>

    <!-- Row 2 Pins -->
    <ellipse cx="-15" cy="10" rx="8" ry="18" fill="#ffffff" stroke="#ff007f" stroke-width="1.5"/>
    <ellipse cx="15" cy="10" rx="8" ry="18" fill="#ffffff" stroke="#ff007f" stroke-width="1.5"/>

    <!-- Headpin (Pin 1) -->
    <ellipse cx="0" cy="25" rx="9" ry="20" fill="#ffffff" stroke="#ff007f" stroke-width="2"/>
    <line x1="-9" y1="20" x2="9" y2="20" stroke="#ef4444" stroke-width="3"/>
    <line x1="-8" y1="26" x2="8" y2="26" stroke="#ef4444" stroke-width="3"/>
  </g>

  <!-- High-Speed Glowing Neon Bowling Ball -->
  <g transform="translate(400, 350)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="48" fill="url(#bowlingBall)"/>
    <!-- 3 Finger Holes -->
    <circle cx="-10" cy="-12" r="5" fill="#020617" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="10" cy="-12" r="5" fill="#020617" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="0" cy="12" r="6" fill="#020617" stroke="#00f0ff" stroke-width="1.5"/>
  </g>

  <!-- Impact Particle Sparks -->
  <g fill="#ffe600" filter="url(#neonGlow)">
    <circle cx="370" cy="180" r="4"/>
    <circle cx="430" cy="160" r="5"/>
    <circle cx="340" cy="220" r="3"/>
    <circle cx="460" cy="200" r="4.5"/>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(400, 48)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="3" filter="url(#neonGlow)">CYBER NEON BOWLING 3D</text>
    <text x="0" y="22" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="4">3D PIN PHYSICS • STRIKES & SPARES • 10 FRAMES</text>
  </g>
</svg>
