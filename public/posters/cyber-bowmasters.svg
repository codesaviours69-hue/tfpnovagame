<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e113a"/>
    </linearGradient>

    <linearGradient id="arrowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="rocketAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>

    <filter id="bowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="hyperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bowBg)"/>

  <!-- Distant Cyber City Grid -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.4">
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Elevated Dueling Platforms -->
  <!-- Left Player Platform (Cyan) -->
  <polygon points="60,320 260,320 280,450 40,450" fill="#042f2e" stroke="#00f0ff" stroke-width="3" filter="url(#bowGlow)"/>
  <line x1="60" y1="320" x2="260" y2="320" stroke="#38bdf8" stroke-width="4"/>

  <!-- Right Player Platform (Crimson/Amber) -->
  <polygon points="540,320 740,320 760,450 520,450" fill="#450a0a" stroke="#f43f5e" stroke-width="3" filter="url(#bowGlow)"/>
  <line x1="540" y1="320" x2="740" y2="320" stroke="#fb7185" stroke-width="4"/>

  <!-- Trajectory Parabolic Dotted Arcs -->
  <path d="M 190,260 Q 380,80 590,260" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="10, 8" opacity="0.85" filter="url(#bowGlow)"/>
  <path d="M 610,260 Q 420,110 210,260" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="10, 8" opacity="0.6" filter="url(#bowGlow)"/>

  <!-- In-Flight Plasma Arrow (Left to Right) -->
  <g transform="translate(380, 150) rotate(15)" filter="url(#bowGlow)">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="url(#arrowCyan)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="30,-6 45,0 30,6" fill="#ffffff"/>
    <circle cx="-30" cy="0" r="8" fill="#38bdf8" opacity="0.7"/>
  </g>

  <!-- In-Flight Thermobaric Rocket (Right to Left) -->
  <g transform="translate(480, 175) rotate(-165)" filter="url(#bowGlow)">
    <rect x="-24" y="-8" width="48" height="16" rx="6" fill="url(#rocketAmber)" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="24,-8 36,0 24,8" fill="#ffffff"/>
    <polygon points="-24,-5 -40,0 -24,5" fill="#facc15"/>
  </g>

  <!-- Left Hero: Cyber Archer Kaito -->
  <g transform="translate(180, 260)" filter="url(#bowGlow)">
    <!-- Legs & Body -->
    <line x1="-12" y1="30" x2="-20" y2="60" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>
    <line x1="12" y1="30" x2="25" y2="60" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-5" x2="0" y2="30" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>

    <!-- Head / Cyber Visor -->
    <circle cx="0" cy="-22" r="15" fill="#0f172a" stroke="#00f0ff" stroke-width="3"/>
    <rect x="-8" y="-25" width="16" height="6" rx="3" fill="#00f0ff"/>

    <!-- Aiming Bow & Arms -->
    <path d="M 25,-40 Q 55,-5 25,30" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
    <path d="M 25,-40 Q 55,-5 25,30" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="-5" x2="15" y2="-5" stroke="#38bdf8" stroke-width="4"/>
    <line x1="15" y1="-5" x2="45" y2="-12" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Right Hero: Mech Gunner Titan -->
  <g transform="translate(620, 260)" filter="url(#bowGlow)">
    <!-- Legs & Body -->
    <line x1="-15" y1="30" x2="-25" y2="60" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
    <line x1="15" y1="30" x2="20" y2="60" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
    <rect x="-16" y="-10" width="32" height="42" rx="6" fill="#be123c" stroke="#f43f5e" stroke-width="3"/>

    <!-- Head & Horns -->
    <rect x="-14" y="-32" width="28" height="20" rx="5" fill="#881337" stroke="#f43f5e" stroke-width="3"/>
    <circle cx="-6" cy="-22" r="4" fill="#facc15"/>
    <circle cx="6" cy="-22" r="4" fill="#facc15"/>

    <!-- Shoulder RPG Launcher -->
    <rect x="-45" y="-28" width="55" height="14" rx="4" fill="#f97316" stroke="#ffffff" stroke-width="2" transform="rotate(18, -20, -20)"/>
  </g>

  <!-- Center Plasma Explosion Burst -->
  <g transform="translate(400, 200)" filter="url(#hyperGlow)">
    <circle cx="0" cy="0" r="28" fill="#facc15" opacity="0.4"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
    <line x1="-35" y1="-35" x2="35" y2="35" stroke="#f97316" stroke-width="3"/>
    <line x1="35" y1="-35" x2="-35" y2="35" stroke="#f97316" stroke-width="3"/>
    <line x1="0" y1="-45" x2="0" y2="45" stroke="#00f0ff" stroke-width="3"/>
  </g>

  <!-- Title Badge Top Header -->
  <g transform="translate(400, 48)" text-anchor="middle">
    <rect x="-250" y="-22" width="500" height="42" rx="21" fill="#7c3aed" fill-opacity="0.35" stroke="#a855f7" stroke-width="2" filter="url(#bowGlow)"/>
    <text x="0" y="5" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="3" filter="url(#bowGlow)">
      CYBER BOWMASTERS: NEON DUEL
    </text>
  </g>

  <!-- Subtitle Tags Bottom -->
  <g transform="translate(400, 430)" text-anchor="middle">
    <text x="0" y="0" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="2">
      ⚡ PHYSICS TRAJECTORY DUEL • 1P CAMPAIGN • 2P LOCAL VS • RAGDOLL HITS
    </text>
  </g>
</svg>
