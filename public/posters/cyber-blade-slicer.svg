<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sliceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#110726"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bladeTrail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#sliceBg)"/>

  <!-- Sliced Cyber Watermelon Halves in Air -->
  <g transform="translate(330, 190)" filter="url(#neonGlow)">
    <!-- Left Half -->
    <path d="M-60,0 A60,60 0 0,1 0,-60 L0,0 Z" fill="#10b981" stroke="#34d399" stroke-width="3"/>
    <path d="M-50,0 A50,50 0 0,1 0,-50 L0,0 Z" fill="#f43f5e"/>
    <circle cx="-20" cy="-20" r="3" fill="#020617"/>
  </g>
  <g transform="translate(470, 240)" filter="url(#neonGlow)">
    <!-- Right Half -->
    <path d="M0,0 L0,60 A60,60 0 0,0 60,0 Z" fill="#10b981" stroke="#34d399" stroke-width="3"/>
    <path d="M0,0 L0,50 A50,50 0 0,0 50,0 Z" fill="#f43f5e"/>
    <circle cx="20" cy="20" r="3" fill="#020617"/>
  </g>

  <!-- Sliced Plasma Orange -->
  <g transform="translate(230, 290)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="32" fill="#f97316" stroke="#fde047" stroke-width="2"/>
    <line x1="-30" y1="-15" x2="30" y2="15" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Neon Katana Blade Swipe Arc Trail -->
  <g filter="url(#neonGlow)">
    <path d="M120,380 Q360,160 680,100" stroke="url(#bladeTrail)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M140,380 Q370,170 680,100" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Splattering Neon Juice Particles & Sparks -->
  <g fill="#f43f5e" filter="url(#neonGlow)">
    <circle cx="380" cy="180" r="6"/>
    <circle cx="420" cy="210" r="8"/>
    <circle cx="360" cy="240" r="5"/>
    <circle cx="450" cy="160" r="4.5"/>
  </g>
  <g fill="#38bdf8" filter="url(#neonGlow)">
    <circle cx="400" cy="190" r="4"/>
    <circle cx="500" cy="140" r="5"/>
    <circle cx="280" cy="260" r="4.5"/>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(400, 46)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="3" filter="url(#neonGlow)">CYBER BLADE SLICER DELUXE</text>
    <text x="0" y="22" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="4">FRUIT NINJA • SLOW-MO COMBOS • BOMB DODGING</text>
  </g>
</svg>
