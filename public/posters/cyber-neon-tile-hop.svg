<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f0728"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="neonBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="90%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <linearGradient id="tilePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="tileCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tileAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="450" fill="url(#skyBg)"/>

  <!-- 3D Perspective Floating Neon EDM Tiles Path -->
  <!-- Distant Tiles -->
  <g filter="url(#neonGlow)" opacity="0.6">
    <ellipse cx="400" cy="140" rx="30" ry="10" fill="url(#tilePink)" stroke="#ffffff" stroke-width="1.5"/>
    <ellipse cx="450" cy="170" rx="38" ry="12" fill="url(#tileCyan)" stroke="#ffffff" stroke-width="1.5"/>
    <ellipse cx="360" cy="205" rx="46" ry="14" fill="url(#tileAmber)" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Midground Tiles -->
  <g filter="url(#neonGlow)">
    <ellipse cx="460" cy="250" rx="58" ry="18" fill="url(#tilePink)" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="340" cy="305" rx="72" ry="22" fill="url(#tileCyan)" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Foreground Tile with Shockwave Ripple -->
  <g transform="translate(420, 380)" filter="url(#neonGlow)">
    <!-- Shockwave Energy Rings -->
    <ellipse cx="0" cy="0" rx="140" ry="40" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="110" ry="32" fill="none" stroke="#ffe600" stroke-width="2" opacity="0.7"/>

    <!-- Main 3D Floating Platform Tile -->
    <ellipse cx="0" cy="0" rx="90" ry="26" fill="url(#tilePink)" stroke="#ffffff" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="70" ry="18" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
  </g>

  <!-- Bouncing Glowing Cyber Neon Ball (With Motion Trail) -->
  <g filter="url(#neonGlow)">
    <!-- Arc Motion Trail -->
    <path d="M340,300 Q380,180 420,290" stroke="#00f0ff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Cyber Ball -->
    <circle cx="420" cy="285" r="32" fill="url(#neonBall)"/>
    <circle cx="420" cy="285" r="32" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Musical Note Spark Particles -->
  <g fill="#ffe600" filter="url(#neonGlow)">
    <circle cx="380" cy="260" r="4"/>
    <circle cx="470" cy="240" r="5"/>
    <circle cx="440" cy="350" r="3.5"/>
    <circle cx="360" cy="370" r="4.5"/>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(400, 46)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="3" filter="url(#neonGlow)">CYBER NEON TILE HOP: EDM RUSH</text>
    <text x="0" y="22" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="4">3D PERSPECTIVE • RHYTHM BOUNCE • SYNTHWAVE BEAT</text>
  </g>
</svg>
