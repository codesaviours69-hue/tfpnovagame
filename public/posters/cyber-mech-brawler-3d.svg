<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050114" />
      <stop offset="50%" stop-color="#0d0426" />
      <stop offset="100%" stop-color="#19063b" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Perspective 3D Neon Colosseum Grid -->
  <g opacity="0.35">
    <line x1="0" y1="380" x2="800" y2="380" stroke="#00f0ff" stroke-width="2" />
    <line x1="0" y1="410" x2="800" y2="410" stroke="#00f0ff" stroke-width="1.5" />
    <line x1="0" y1="445" x2="800" y2="445" stroke="#00f0ff" stroke-width="1.5" />
    <line x1="0" y1="485" x2="800" y2="485" stroke="#00f0ff" stroke-width="2" />
    
    <line x1="400" y1="340" x2="0" y2="500" stroke="#00f0ff" stroke-width="2" />
    <line x1="400" y1="340" x2="160" y2="500" stroke="#00f0ff" stroke-width="1.5" />
    <line x1="400" y1="340" x2="320" y2="500" stroke="#00f0ff" stroke-width="1.5" />
    <line x1="400" y1="340" x2="480" y2="500" stroke="#00f0ff" stroke-width="1.5" />
    <line x1="400" y1="340" x2="640" y2="500" stroke="#00f0ff" stroke-width="1.5" />
    <line x1="400" y1="340" x2="800" y2="500" stroke="#00f0ff" stroke-width="2" />
  </g>

  <!-- Background Arena Hologram Columns -->
  <g opacity="0.4">
    <rect x="80" y="160" width="30" height="220" fill="none" stroke="#00f0ff" stroke-width="2" />
    <rect x="690" y="160" width="30" height="220" fill="none" stroke="#ff0055" stroke-width="2" />
    <circle cx="95" cy="150" r="18" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glow)" />
    <circle cx="705" cy="150" r="18" fill="none" stroke="#ff0055" stroke-width="3" filter="url(#glow)" />
  </g>

  <!-- Energy Shield Dome Aura -->
  <ellipse cx="400" cy="300" rx="220" ry="160" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="10 6" opacity="0.6" filter="url(#glow)" />

  <!-- Giant Battle Mech Graphic (Center) -->
  <g transform="translate(400, 270)">
    <!-- Shadow -->
    <ellipse cx="0" cy="100" rx="140" ry="25" fill="#000000" opacity="0.7" />

    <!-- Mech Legs -->
    <path d="M-60 20 L-85 95 L-55 95 L-40 40 Z" fill="url(#metal)" stroke="#00f0ff" stroke-width="2.5" />
    <path d="M60 20 L85 95 L55 95 L40 40 Z" fill="url(#metal)" stroke="#00f0ff" stroke-width="2.5" />
    <!-- Knee Joint Caps -->
    <circle cx="-65" cy="45" r="10" fill="#0f172a" stroke="#ff0055" stroke-width="2.5" />
    <circle cx="65" cy="45" r="10" fill="#0f172a" stroke="#ff0055" stroke-width="2.5" />

    <!-- Pelvis / Waist -->
    <polygon points="-45,25 45,25 30,5 -30,5" fill="#0f172a" stroke="#00f0ff" stroke-width="2" />

    <!-- Heavy Torso -->
    <path d="M-75 -50 L75 -50 L55 15 L-55 15 Z" fill="url(#metal)" stroke="#00f0ff" stroke-width="3.5" filter="url(#glow)" />
    
    <!-- Chest Reactor Core (Glowing Hexagon) -->
    <polygon points="0,-35 22,-22 22,2 0,15 -22,2 -22,-22" fill="#00f0ff" stroke="#ffffff" stroke-width="3" filter="url(#heavyGlow)" />
    <circle cx="0" cy="-10" r="8" fill="#ffffff" filter="url(#heavyGlow)" />

    <!-- Head / Visor -->
    <polygon points="-30,-85 30,-85 22,-52 -22,-52" fill="#020617" stroke="#00f0ff" stroke-width="2.5" />
    <!-- Glowing Visor Eye Line -->
    <line x1="-18" y1="-68" x2="18" y2="-68" stroke="#ff0055" stroke-width="5" stroke-linecap="round" filter="url(#heavyGlow)" />

    <!-- Shoulder Missile Pods -->
    <g transform="translate(-105, -70)">
      <rect x="0" y="0" width="38" height="42" rx="6" fill="#1e1b4b" stroke="#ff0055" stroke-width="2.5" />
      <circle cx="10" cy="12" r="4" fill="#ff0055" filter="url(#glow)" />
      <circle cx="28" cy="12" r="4" fill="#ff0055" filter="url(#glow)" />
      <circle cx="10" cy="30" r="4" fill="#ff0055" filter="url(#glow)" />
      <circle cx="28" cy="30" r="4" fill="#ff0055" filter="url(#glow)" />
    </g>
    <g transform="translate(67, -70)">
      <rect x="0" y="0" width="38" height="42" rx="6" fill="#1e1b4b" stroke="#ff0055" stroke-width="2.5" />
      <circle cx="10" cy="12" r="4" fill="#ff0055" filter="url(#glow)" />
      <circle cx="28" cy="12" r="4" fill="#ff0055" filter="url(#glow)" />
      <circle cx="10" cy="30" r="4" fill="#ff0055" filter="url(#glow)" />
      <circle cx="28" cy="30" r="4" fill="#ff0055" filter="url(#glow)" />
    </g>

    <!-- Left Arm: Glowing Plasma Katana Blade -->
    <g transform="translate(-85, -25)">
      <rect x="-18" y="0" width="18" height="50" fill="#0f172a" stroke="#00f0ff" stroke-width="2" />
      <!-- Energy Blade -->
      <path d="M-10 45 L-16 130 L-8 140 L-2 45 Z" fill="#00f0ff" stroke="#ffffff" stroke-width="3" filter="url(#heavyGlow)" />
    </g>

    <!-- Right Arm: Heavy Tri-Barrel Plasma Gatling -->
    <g transform="translate(85, -25)">
      <rect x="0" y="0" width="22" height="45" fill="#0f172a" stroke="#00f0ff" stroke-width="2" />
      <rect x="5" y="45" width="12" height="60" fill="#020617" stroke="#ff0055" stroke-width="2" />
      <!-- Muzzle Flash Sparks -->
      <circle cx="11" cy="115" r="14" fill="#ffe600" filter="url(#heavyGlow)" />
    </g>
  </g>

  <!-- Title Badge & Typography -->
  <g transform="translate(400, 65)">
    <!-- Top Cyber Tag -->
    <rect x="-130" y="-35" width="260" height="26" rx="13" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1.5" />
    <text x="0" y="-18" fill="#00f0ff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="3" text-anchor="middle">3D MECH ARENA COMBAT</text>

    <!-- Main Title -->
    <text x="0" y="24" fill="url(#neonCyan)" font-family="system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="2" text-anchor="middle" filter="url(#glow)">CYBER MECH</text>
    <text x="0" y="58" fill="url(#neonPink)" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="6" text-anchor="middle" filter="url(#glow)">TITAN COLOSSEUM</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(400, 465)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#020617" stroke="#ff0055" stroke-width="2" />
    <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">GATLING • BLADES • MISSILES • BOSSES</text>
  </g>
</svg>
