<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="plasmaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Cyber Grid Background -->
  <g stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Laser Beams from Center Hero -->
  <g stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)">
    <line x1="400" y1="225" x2="150" y2="120"/>
    <line x1="400" y1="225" x2="650" y2="140"/>
    <line x1="400" y1="225" x2="220" y2="360"/>
    <line x1="400" y1="225" x2="620" y2="340"/>
  </g>

  <!-- Energy Katana Orbit Circle -->
  <circle cx="400" cy="225" r="95" fill="none" stroke="#ff007f" stroke-width="3" stroke-dasharray="14 10" filter="url(#neonGlow)"/>
  <circle cx="485" cy="180" r="14" fill="#ff007f" filter="url(#neonGlow)"/>
  <circle cx="315" cy="270" r="14" fill="#ff007f" filter="url(#neonGlow)"/>

  <!-- Center Hero Cyber Exo-Suit -->
  <circle cx="400" cy="225" r="32" fill="#090d16" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)"/>
  <circle cx="400" cy="225" r="18" fill="url(#plasmaCore)"/>

  <!-- Swarm Drone Enemies -->
  <g filter="url(#neonGlow)">
    <!-- Drone 1 -->
    <circle cx="150" cy="120" r="22" fill="#090d16" stroke="#f43f5e" stroke-width="3"/>
    <circle cx="150" cy="120" r="10" fill="#f43f5e"/>

    <!-- Drone 2 -->
    <circle cx="650" cy="140" r="24" fill="#090d16" stroke="#f43f5e" stroke-width="3"/>
    <circle cx="650" cy="140" r="11" fill="#f43f5e"/>

    <!-- Spider Drone 3 -->
    <polygon points="220,335 240,370 200,370" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>

    <!-- Spider Drone 4 -->
    <polygon points="620,320 645,355 595,355" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>

    <!-- XP Energy Matter Orbs -->
    <circle cx="280" cy="160" r="8" fill="#ffe600"/>
    <circle cx="520" cy="300" r="8" fill="#ffe600"/>
    <circle cx="340" cy="320" r="8" fill="#ffe600"/>
    <circle cx="490" cy="130" r="8" fill="#ffe600"/>
  </g>

  <!-- Title Badge Banner -->
  <g transform="translate(400, 65)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="3" filter="url(#neonGlow)">CYBER NEON SURVIVOR: ROGUE ARENA</text>
    <text x="0" y="24" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="4">UNLIMITED HORDE BATTLE • ROGUE-LITE UPGRADES</text>
  </g>
</svg>
