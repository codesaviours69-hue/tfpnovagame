<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b112c"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="neonBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <linearGradient id="brickPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="brickAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="brickPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Chamber Border -->
  <rect x="220" y="50" width="360" height="360" rx="16" fill="#0f172a" fill-opacity="0.7" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Numbered Glowing Neon Bricks -->
  <g filter="url(#neonGlow)">
    <!-- Row 1 -->
    <rect x="250" y="80" width="60" height="40" rx="8" fill="url(#brickPink)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="280" y="106" fill="#ffffff" font-family="monospace" font-weight="900" font-size="18" text-anchor="middle">45</text>

    <rect x="330" y="80" width="60" height="40" rx="8" fill="url(#brickAmber)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="360" y="106" fill="#ffffff" font-family="monospace" font-weight="900" font-size="18" text-anchor="middle">32</text>

    <rect x="410" y="80" width="60" height="40" rx="8" fill="url(#brickPurple)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="440" y="106" fill="#ffffff" font-family="monospace" font-weight="900" font-size="18" text-anchor="middle">60</text>

    <rect x="490" y="80" width="60" height="40" rx="8" fill="url(#brickPink)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="520" y="106" fill="#ffffff" font-family="monospace" font-weight="900" font-size="18" text-anchor="middle">24</text>

    <!-- Row 2 -->
    <rect x="250" y="140" width="60" height="40" rx="8" fill="url(#brickAmber)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="280" y="166" fill="#ffffff" font-family="monospace" font-weight="900" font-size="18" text-anchor="middle">18</text>

    <rect x="410" y="140" width="60" height="40" rx="8" fill="url(#brickPink)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="440" y="166" fill="#ffffff" font-family="monospace" font-weight="900" font-size="18" text-anchor="middle">50</text>
  </g>

  <!-- Power-Up Plus Ball Orb -->
  <g transform="translate(360, 160)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="14" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">+</text>
  </g>

  <!-- Stream of Rapid-Fire Bouncing Neon Laser Balls -->
  <g filter="url(#neonGlow)">
    <!-- Trajectory dashed ray -->
    <line x1="400" y1="380" x2="310" y2="120" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6,6"/>

    <circle cx="385" cy="335" r="9" fill="url(#neonBall)" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="370" cy="290" r="9" fill="url(#neonBall)" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="355" cy="245" r="9" fill="url(#neonBall)" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="340" cy="200" r="9" fill="url(#neonBall)" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="325" cy="155" r="9" fill="url(#neonBall)" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Bottom Launch Cannon -->
  <g transform="translate(400, 385)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="18" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" fill="#020617" font-family="monospace" font-weight="900" font-size="12" text-anchor="middle">x50</text>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(400, 42)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="30" letter-spacing="3" filter="url(#neonGlow)">CYBER NEON BRICK CRUSHER</text>
    <text x="0" y="20" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="4">PHYSICS BOUNCE • 100+ LASER BALLS • BBTAN STYLE</text>
  </g>
</svg>
