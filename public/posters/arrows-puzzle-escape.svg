<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#00f2fe"/>
    </marker>
    <marker id="arrowhead-white" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#ffffff"/>
    </marker>
    <marker id="arrowhead-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#ff0844"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Subtle Minimalist Grid Dots -->
  <g opacity="0.15" fill="#38bdf8">
    <circle cx="100" cy="80" r="2"/><circle cx="150" cy="80" r="2"/><circle cx="200" cy="80" r="2"/><circle cx="250" cy="80" r="2"/><circle cx="300" cy="80" r="2"/><circle cx="350" cy="80" r="2"/><circle cx="400" cy="80" r="2"/><circle cx="450" cy="80" r="2"/><circle cx="500" cy="80" r="2"/><circle cx="550" cy="80" r="2"/><circle cx="600" cy="80" r="2"/><circle cx="650" cy="80" r="2"/><circle cx="700" cy="80" r="2"/>
    <circle cx="100" cy="140" r="2"/><circle cx="150" cy="140" r="2"/><circle cx="200" cy="140" r="2"/><circle cx="250" cy="140" r="2"/><circle cx="300" cy="140" r="2"/><circle cx="350" cy="140" r="2"/><circle cx="400" cy="140" r="2"/><circle cx="450" cy="140" r="2"/><circle cx="500" cy="140" r="2"/><circle cx="550" cy="140" r="2"/><circle cx="600" cy="140" r="2"/><circle cx="650" cy="140" r="2"/><circle cx="700" cy="140" r="2"/>
    <circle cx="100" cy="200" r="2"/><circle cx="150" cy="200" r="2"/><circle cx="200" cy="200" r="2"/><circle cx="250" cy="200" r="2"/><circle cx="300" cy="200" r="2"/><circle cx="350" cy="200" r="2"/><circle cx="400" cy="200" r="2"/><circle cx="450" cy="200" r="2"/><circle cx="500" cy="200" r="2"/><circle cx="550" cy="200" r="2"/><circle cx="600" cy="200" r="2"/><circle cx="650" cy="200" r="2"/><circle cx="700" cy="200" r="2"/>
    <circle cx="100" cy="260" r="2"/><circle cx="150" cy="260" r="2"/><circle cx="200" cy="260" r="2"/><circle cx="250" cy="260" r="2"/><circle cx="300" cy="260" r="2"/><circle cx="350" cy="260" r="2"/><circle cx="400" cy="260" r="2"/><circle cx="450" cy="260" r="2"/><circle cx="500" cy="260" r="2"/><circle cx="550" cy="260" r="2"/><circle cx="600" cy="260" r="2"/><circle cx="650" cy="260" r="2"/><circle cx="700" cy="260" r="2"/>
    <circle cx="100" cy="320" r="2"/><circle cx="150" cy="320" r="2"/><circle cx="200" cy="320" r="2"/><circle cx="250" cy="320" r="2"/><circle cx="300" cy="320" r="2"/><circle cx="350" cy="320" r="2"/><circle cx="400" cy="320" r="2"/><circle cx="450" cy="320" r="2"/><circle cx="500" cy="320" r="2"/><circle cx="550" cy="320" r="2"/><circle cx="600" cy="320" r="2"/><circle cx="650" cy="320" r="2"/><circle cx="700" cy="320" r="2"/>
  </g>

  <!-- Central Puzzle Studio Card -->
  <g transform="translate(260, 45)">
    <rect width="280" height="360" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" opacity="0.98"/>
    
    <!-- Top 3 Hearts ❤️❤️❤️ -->
    <g transform="translate(140, 30)" text-anchor="middle">
      <text x="-25" y="0" font-size="18">❤️</text>
      <text x="0" y="0" font-size="18">❤️</text>
      <text x="25" y="0" font-size="18">❤️</text>
    </g>

    <!-- Interlocking Maze Pattern on White Canvas -->
    <g stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Left upward escape arrow -->
      <path d="M 30,300 L 30,70" marker-end="url(#arrowhead-white)" stroke="#0f172a"/>
      <!-- Top rightward loop -->
      <path d="M 60,300 L 60,95 L 240,95" marker-end="url(#arrowhead-white)"/>
      <!-- Center snake -->
      <path d="M 240,125 L 90,125 L 90,165 L 210,165" marker-end="url(#arrowhead-white)"/>
      <!-- Middle winding lock -->
      <path d="M 60,205 L 240,205" marker-end="url(#arrowhead-white)"/>
      <path d="M 240,240 L 70,240" marker-end="url(#arrowhead-white)"/>
      <!-- Highlighted Pink Escape Arrow -->
      <path d="M 215,310 L 215,265 L 180,265 L 180,310" stroke="#ff0844" stroke-width="4.5" marker-end="url(#arrowhead-pink)"/>
      <!-- Bottom right escape -->
      <path d="M 80,275 L 150,275 L 150,320" marker-end="url(#arrowhead-white)"/>
    </g>
  </g>

  <!-- Left Side Glowing Brand Art -->
  <g transform="translate(130, 225)" text-anchor="middle">
    <!-- Stylized Big Escape Arrow -->
    <path d="M -50,60 L 0,-40 L 50,60 L 15,40 L 15,90 L -15,90 L -15,40 Z" fill="url(#cyanGlow)" filter="url(#glow)"/>
  </g>

  <!-- Title & Subtitle Badge (Top/Bottom) -->
  <g transform="translate(400, 420)" text-anchor="middle">
    <rect x="-240" y="-35" width="480" height="42" rx="21" fill="#090d16" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="-8" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="3">ARROWS – PUZZLE ESCAPE</text>
  </g>
</svg>
