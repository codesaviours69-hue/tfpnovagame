<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#090d24"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="droneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Cyber Skyline -->
  <rect x="40" y="280" width="90" height="320" fill="#0f172a"/>
  <rect x="160" y="220" width="110" height="380" fill="#0f172a"/>
  <rect x="300" y="320" width="80" height="280" fill="#0f172a"/>
  <rect x="420" y="180" width="130" height="420" fill="#0f172a"/>
  <rect x="580" y="260" width="100" height="340" fill="#0f172a"/>
  <rect x="710" y="300" width="80" height="300" fill="#0f172a"/>

  <!-- Glowing Laser Gates -->
  <rect x="520" y="0" width="48" height="180" fill="#090d16" stroke="#f43f5e" stroke-width="4" filter="url(#neonGlow)"/>
  <rect x="520" y="380" width="48" height="220" fill="#090d16" stroke="#f43f5e" stroke-width="4" filter="url(#neonGlow)"/>
  <line x1="544" y1="180" x2="544" y2="380" stroke="#f43f5e" stroke-width="6" stroke-dasharray="12 8" filter="url(#neonGlow)"/>

  <rect x="180" y="0" width="48" height="240" fill="#090d16" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)"/>
  <rect x="180" y="440" width="48" height="160" fill="#090d16" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Floating Energy Orb -->
  <circle cx="544" cy="280" r="22" fill="#facc15" filter="url(#neonGlow)"/>
  <circle cx="544" cy="280" r="14" fill="#ffffff"/>

  <!-- Cyber Drone -->
  <g transform="translate(340, 270)" filter="url(#neonGlow)">
    <!-- Shield -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#00f0ff" stroke-width="4" stroke-dasharray="16 8"/>

    <!-- Drone Body -->
    <ellipse cx="0" cy="0" rx="44" ry="26" fill="url(#droneGrad)"/>
    <rect x="10" y="-8" width="24" height="16" rx="4" fill="#00f0ff"/>

    <!-- Jet Flame -->
    <polygon points="-44,4 -75,0 -44,-4" fill="#facc15"/>
    <polygon points="-44,2 -60,0 -44,-2" fill="#ffffff"/>

    <!-- Rotor Blades -->
    <line x1="-36" y1="-32" x2="36" y2="-32" stroke="#ffffff" stroke-width="5"/>
    <circle cx="0" cy="-32" r="6" fill="#0284c7"/>
  </g>

  <!-- Ground Grid -->
  <line x1="0" y1="560" x2="800" y2="560" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Game Title Badge -->
  <rect x="180" y="480" width="440" height="68" rx="20" fill="#030712" stroke="#00f0ff" stroke-width="2" filter="url(#neonGlow)"/>
  <text x="400" y="524" fill="#00f0ff" font-size="28" font-family="sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">
    CYBER FLAPPY NEON
  </text>
</svg>
