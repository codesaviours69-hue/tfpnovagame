<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#09143c"/>
      <stop offset="70%" stop-color="#1e0b36"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyperGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Energy Ball Radial Gradient -->
    <radialGradient id="energyBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="90%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <!-- Rocket Flame Gradient -->
    <linearGradient id="boostFlame" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Arena Pitch Floor Gradient -->
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Cyber Stadium Dome Arch Ribs -->
  <g opacity="0.35">
    <ellipse cx="400" cy="200" rx="360" ry="160" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="16 10"/>
    <ellipse cx="400" cy="180" rx="300" ry="130" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="12 8"/>
    <ellipse cx="400" cy="160" rx="220" ry="90" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
    <!-- Dome Floodlights -->
    <circle cx="120" cy="140" r="80" fill="#00f0ff" opacity="0.12" filter="url(#hyperGlow)"/>
    <circle cx="680" cy="140" r="80" fill="#f97316" opacity="0.12" filter="url(#hyperGlow)"/>
  </g>

  <!-- 3D Arena Soccer Pitch Floor -->
  <polygon points="50,580 750,580 620,380 180,380" fill="url(#pitchGrad)" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Pitch Grid Lines -->
  <line x1="400" y1="380" x2="400" y2="580" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)"/>
  <ellipse cx="400" cy="480" rx="140" ry="45" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#neonGlow)"/>
  <circle cx="400" cy="480" r="6" fill="#facc15" filter="url(#neonGlow)"/>

  <!-- Orange Team Goal Arc (Right) -->
  <path d="M 620,380 Q 720,440 750,580" fill="none" stroke="#f97316" stroke-width="5" filter="url(#neonGlow)"/>
  <!-- Blue Team Goal Arc (Left) -->
  <path d="M 180,380 Q 80,440 50,580" fill="none" stroke="#00f0ff" stroke-width="5" filter="url(#neonGlow)"/>

  <!-- Nitro Boost Orbs on Pitch -->
  <circle cx="240" cy="460" r="12" fill="#facc15" opacity="0.8" filter="url(#hyperGlow)"/>
  <circle cx="560" cy="460" r="12" fill="#facc15" opacity="0.8" filter="url(#hyperGlow)"/>
  <circle cx="400" cy="400" r="10" fill="#facc15" opacity="0.8" filter="url(#hyperGlow)"/>

  <!-- Aerial Supersonic Rocket Blast Trails -->
  <path d="M 80,500 C 180,420 280,360 360,330" fill="none" stroke="url(#boostFlame)" stroke-width="16" stroke-linecap="round" opacity="0.8" filter="url(#hyperGlow)"/>
  <path d="M 80,500 C 180,420 280,360 360,330" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <!-- BLUE BATTLE-CAR (Aerial Volley Striker Launching Upward) -->
  <g transform="translate(300, 360) rotate(-28)">
    <!-- Rocket Thruster Cone -->
    <polygon points="-40,10 -80,18 -40,26" fill="#00f0ff" filter="url(#hyperGlow)"/>
    <polygon points="-40,12 -110,18 -40,24" fill="#facc15" filter="url(#hyperGlow)"/>

    <!-- Car Shadow -->
    <ellipse cx="10" cy="40" rx="55" ry="14" fill="#000000" opacity="0.7"/>

    <!-- Car Body -->
    <polygon points="-35,5 30,-5 55,10 40,28 -35,28" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonGlow)"/>
    <polygon points="-20,5 15,-3 28,10 -20,10" fill="#030712" stroke="#00f0ff" stroke-width="1.5"/>

    <!-- Decals & Underglow -->
    <rect x="-30" y="24" width="65" height="4" fill="#00f0ff" filter="url(#hyperGlow)"/>
    <rect x="-38" y="2" width="10" height="18" rx="2" fill="#f43f5e" stroke="#ffffff" stroke-width="1"/>

    <!-- 4 Wheels with Neon Rims -->
    <rect x="-30" y="20" width="14" height="12" rx="3" fill="#090d16" stroke="#00f0ff" stroke-width="2"/>
    <rect x="25" y="16" width="14" height="12" rx="3" fill="#090d16" stroke="#00f0ff" stroke-width="2"/>
  </g>

  <!-- ORANGE DEFENDER CAR (Right Goal Save) -->
  <g transform="translate(560, 380) rotate(18)">
    <!-- Thruster -->
    <polygon points="40,8 85,16 40,24" fill="#f97316" filter="url(#hyperGlow)"/>
    <!-- Car Body -->
    <polygon points="35,5 -30,-5 -55,10 -40,28 35,28" fill="#ea580c" stroke="#fb923c" stroke-width="2.5" filter="url(#neonGlow)"/>
    <polygon points="20,5 -15,-3 -28,10 20,10" fill="#030712" stroke="#facc15" stroke-width="1.5"/>
    <rect x="-35" y="24" width="65" height="4" fill="#f97316" filter="url(#hyperGlow)"/>
    <!-- Wheels -->
    <rect x="-35" y="16" width="14" height="12" rx="3" fill="#090d16" stroke="#facc15" stroke-width="2"/>
    <rect x="20" y="20" width="14" height="12" rx="3" fill="#090d16" stroke="#facc15" stroke-width="2"/>
  </g>

  <!-- GIANT GLOWING ENERGY SOCCER BALL (Center Stage Impact) -->
  <g transform="translate(420, 270)">
    <!-- Shockwave Rings -->
    <ellipse cx="0" cy="0" rx="90" ry="70" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6" stroke-dasharray="12 6" filter="url(#hyperGlow)"/>
    <ellipse cx="0" cy="0" rx="120" ry="95" fill="none" stroke="#facc15" stroke-width="2" opacity="0.4" stroke-dasharray="16 10" filter="url(#hyperGlow)"/>

    <!-- Ball Outer Glow -->
    <circle cx="0" cy="0" r="54" fill="url(#energyBall)" stroke="#ffffff" stroke-width="3.5" filter="url(#hyperGlow)"/>

    <!-- Hexagonal Holographic Soccer Panels -->
    <polygon points="0,-32 24,-16 24,16 0,32 -24,16 -24,-16" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
    <polygon points="0,-16 12,-8 12,8 0,16 -12,8 -12,-8" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="-32" x2="0" y2="-52" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="24" y1="-16" x2="44" y2="-24" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="24" y1="16" x2="44" y2="24" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="0" y1="32" x2="0" y2="52" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-24" y1="16" x2="-44" y2="24" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-24" y1="-16" x2="-44" y2="-24" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Specular Highlight Flare -->
    <circle cx="-16" cy="-16" r="8" fill="#ffffff" filter="url(#neonGlow)"/>
  </g>

  <!-- FLOATING SPARKS & IMPACT EMBER PARTICLES -->
  <circle cx="370" cy="240" r="3" fill="#facc15" filter="url(#neonGlow)"/>
  <circle cx="480" cy="230" r="4" fill="#00f0ff" filter="url(#neonGlow)"/>
  <circle cx="440" cy="340" r="3.5" fill="#f43f5e" filter="url(#neonGlow)"/>
  <circle cx="320" cy="290" r="2.5" fill="#ffffff" filter="url(#hyperGlow)"/>
  <circle cx="510" cy="300" r="3" fill="#facc15" filter="url(#hyperGlow)"/>

  <!-- SCOREBOARD BADGE OVERLAY -->
  <g transform="translate(400, 60)">
    <!-- Header Score Box -->
    <rect x="-160" y="-24" width="320" height="48" rx="24" fill="#030712" fill-opacity="0.88" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonGlow)"/>
    <!-- Blue Team Score -->
    <text x="-90" y="9" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" fill="#00f0ff" text-anchor="middle" filter="url(#neonGlow)">3</text>
    <text x="-45" y="6" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#38bdf8" text-anchor="middle">BLUE</text>
    <!-- VS / Match Time -->
    <text x="0" y="7" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#facc15" text-anchor="middle">02:45</text>
    <!-- Orange Team Score -->
    <text x="45" y="6" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#fb923c" text-anchor="middle">ORANGE</text>
    <text x="90" y="9" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" fill="#f97316" text-anchor="middle" filter="url(#neonGlow)">2</text>
  </g>

  <!-- TITLE TYPOGRAPHY -->
  <g transform="translate(400, 140)">
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="48" fill="#38bdf8" text-anchor="middle" letter-spacing="5" opacity="0.6" filter="url(#hyperGlow)">CYBER ROCKET LEAGUE 3D</text>
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="48" fill="#ffffff" text-anchor="middle" letter-spacing="5">CYBER ROCKET LEAGUE 3D</text>
    <rect x="-140" y="10" width="280" height="26" rx="13" fill="#f59e0b" filter="url(#neonGlow)"/>
    <text x="0" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" fill="#000000" text-anchor="middle" letter-spacing="4">TURBO CAR SOCCER ARENA</text>
  </g>
</svg>
