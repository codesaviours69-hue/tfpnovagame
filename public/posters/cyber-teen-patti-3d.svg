<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c071e"/>
      <stop offset="50%" stop-color="#1b0a38"/>
      <stop offset="100%" stop-color="#04020a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffee00"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>

  <!-- Casino Table Grid & Lighting -->
  <ellipse cx="200" cy="240" rx="190" ry="80" fill="#09261a" stroke="#00f2fe" stroke-width="3" opacity="0.6"/>
  <ellipse cx="200" cy="240" rx="150" ry="60" fill="none" stroke="#ffea00" stroke-width="2" stroke-dasharray="8 6" opacity="0.8"/>

  <!-- 3 Glowing Casino Chips Stack -->
  <g transform="translate(200, 210)">
    <ellipse cx="0" cy="12" rx="35" ry="12" fill="#000" opacity="0.5"/>
    <!-- Bottom Chip -->
    <ellipse cx="0" cy="8" rx="30" ry="10" fill="#00f2fe" stroke="#fff" stroke-width="1.5"/>
    <!-- Middle Chip -->
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="#ff007f" stroke="#fff" stroke-width="1.5"/>
    <!-- Top Chip -->
    <ellipse cx="0" cy="-8" rx="30" ry="10" fill="url(#goldGrad)" stroke="#fff" stroke-width="2" filter="url(#neonGlow)"/>
    <circle cx="0" cy="-8" r="6" fill="#fff" opacity="0.9"/>
  </g>

  <!-- 3 Cards Fan (Trail A-A-A) -->
  <!-- Left Ace Card -->
  <g transform="translate(115, 60) rotate(-16)">
    <rect width="80" height="120" rx="10" fill="#0b0618" stroke="#00f2fe" stroke-width="2.5" filter="url(#neonGlow)"/>
    <text x="14" y="28" fill="#00f2fe" font-family="sans-serif" font-weight="900" font-size="20">A</text>
    <text x="14" y="44" fill="#00f2fe" font-family="sans-serif" font-size="14">♠</text>
    <text x="40" y="75" fill="#00f2fe" font-family="sans-serif" font-weight="900" font-size="28" text-anchor="middle">♠</text>
  </g>

  <!-- Right Ace Card -->
  <g transform="translate(205, 65) rotate(16)">
    <rect width="80" height="120" rx="10" fill="#0b0618" stroke="#ff007f" stroke-width="2.5" filter="url(#neonGlow)"/>
    <text x="14" y="28" fill="#ff007f" font-family="sans-serif" font-weight="900" font-size="20">A</text>
    <text x="14" y="44" fill="#ff007f" font-family="sans-serif" font-size="14">♥</text>
    <text x="40" y="75" fill="#ff007f" font-family="sans-serif" font-weight="900" font-size="28" text-anchor="middle">♥</text>
  </g>

  <!-- Center Ace Card -->
  <g transform="translate(160, 45)">
    <rect width="84" height="128" rx="10" fill="#0d0720" stroke="#ffea00" stroke-width="3" filter="url(#neonGlow)"/>
    <text x="16" y="30" fill="#ffea00" font-family="sans-serif" font-weight="900" font-size="22">A</text>
    <text x="16" y="46" fill="#ffea00" font-family="sans-serif" font-size="14">♦</text>
    <text x="42" y="80" fill="#ffea00" font-family="sans-serif" font-weight="900" font-size="32" text-anchor="middle">♦</text>
  </g>

  <!-- Title Banner -->
  <text x="200" y="278" fill="#ffea00" font-family="sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="3" filter="url(#neonGlow)">
    CYBER TEEN PATTI 3D
  </text>
</svg>
