<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bowlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="laneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="bowlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bowlBg)"/>

  <!-- Perspective 3D Bowling Lane Floor -->
  <polygon points="300,120 500,120 720,450 80,450" fill="url(#laneGrad)" stroke="#00f0ff" stroke-width="2"/>
  <line x1="400" y1="120" x2="400" y2="450" stroke="#00f0ff" stroke-width="2" stroke-dasharray="16 12" stroke-opacity="0.6"/>

  <!-- Glowing Neon Pins Cluster at Top Deck (Triangle Formation) -->
  <g transform="translate(400, 135)" filter="url(#bowlGlow)">
    <!-- Row 4 -->
    <rect x="-60" y="-30" width="12" height="30" rx="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="-20" y="-30" width="12" height="30" rx="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="20" y="-30" width="12" height="30" rx="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="60" y="-30" width="12" height="30" rx="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Row 3 -->
    <rect x="-40" y="-20" width="12" height="30" rx="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="-20" width="12" height="30" rx="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="40" y="-20" width="12" height="30" rx="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Row 2 -->
    <rect x="-20" y="-10" width="12" height="30" rx="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="20" y="-10" width="12" height="30" rx="4" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Headpin (Row 1) -->
    <rect x="-6" y="0" width="12" height="30" rx="4" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-6" y="8" width="12" height="4" fill="#f43f5e"/>
  </g>

  <!-- Rolling Cyber Plasma Bowling Ball with Hook Trail -->
  <path d="M 280,420 Q 360,260 395,150" fill="none" stroke="#00f0ff" stroke-width="6" stroke-dasharray="14 8" filter="url(#bowlGlow)"/>
  <g transform="translate(330, 310)" filter="url(#bowlGlow)">
    <circle cx="0" cy="0" r="45" fill="#00f0ff" stroke="#ffffff" stroke-width="3"/>
    <!-- Finger Holes -->
    <circle cx="-12" cy="-10" r="8" fill="#0f172a"/>
    <circle cx="12" cy="-10" r="8" fill="#0f172a"/>
    <circle cx="0" cy="12" r="9" fill="#0f172a"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 50)" text-anchor="middle">
    <rect x="-260" y="-25" width="520" height="42" rx="12" fill="#0369a1" fill-opacity="0.6" stroke="#38bdf8" stroke-width="2" filter="url(#bowlGlow)"/>
    <text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="24" letter-spacing="3" text-anchor="middle">CYBER NEON BOWLING 3D</text>
  </g>
</svg>
