<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="scopeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#020617" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </radialGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Night Sky Background -->
  <rect width="800" height="600" fill="url(#nightSky)"/>

  <!-- City Skyline Silhouette -->
  <rect x="40" y="240" width="80" height="360" fill="#070d1d" stroke="#1e293b"/>
  <rect x="140" y="160" width="90" height="440" fill="#0a1530" stroke="#1e293b"/>
  <rect x="250" y="220" width="70" height="380" fill="#070d1d" stroke="#1e293b"/>
  <rect x="490" y="180" width="80" height="420" fill="#0a1530" stroke="#1e293b"/>
  <rect x="590" y="140" width="100" height="460" fill="#070d1d" stroke="#1e293b"/>
  <rect x="710" y="250" width="60" height="350" fill="#0a1530" stroke="#1e293b"/>

  <!-- Hostile Target Silhouette on Rooftop with Red Laser Warning -->
  <circle cx="400" cy="280" r="14" fill="#f43f5e" filter="url(#neonGlow)"/>
  <polygon points="385,340 415,340 410,294 390,294" fill="#e11d48"/>

  <!-- Giant High-Tech Sniper Scope Overlay -->
  <circle cx="400" cy="280" r="210" fill="url(#scopeGlow)" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Scope Crosshairs & Mil-Dots -->
  <line x1="190" y1="280" x2="610" y2="280" stroke="#00f0ff" stroke-width="2"/>
  <line x1="400" y1="70" x2="400" y2="490" stroke="#00f0ff" stroke-width="2"/>

  <!-- Center Laser Target Reticle -->
  <circle cx="400" cy="280" r="28" fill="none" stroke="#f43f5e" stroke-width="3" filter="url(#neonGlow)"/>
  <circle cx="400" cy="280" r="4" fill="#f43f5e"/>

  <!-- Mil-Dots -->
  <circle cx="340" cy="280" r="3" fill="#00f0ff"/>
  <circle cx="370" cy="280" r="3" fill="#00f0ff"/>
  <circle cx="430" cy="280" r="3" fill="#00f0ff"/>
  <circle cx="460" cy="280" r="3" fill="#00f0ff"/>
  <circle cx="400" cy="220" r="3" fill="#00f0ff"/>
  <circle cx="400" cy="250" r="3" fill="#00f0ff"/>
  <circle cx="400" cy="310" r="3" fill="#00f0ff"/>
  <circle cx="400" cy="340" r="3" fill="#00f0ff"/>

  <!-- Rangefinder Digital Readout -->
  <rect x="230" y="440" width="130" height="30" rx="8" fill="#030712" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="295" y="460" fill="#00f0ff" font-size="12" font-family="monospace" font-weight="900" text-anchor="middle">
    RANGE: 245M
  </text>

  <!-- Wind Gauge -->
  <rect x="440" y="440" width="130" height="30" rx="8" fill="#030712" stroke="#facc15" stroke-width="1.5"/>
  <text x="505" y="460" fill="#facc15" font-size="12" font-family="monospace" font-weight="900" text-anchor="middle">
    WIND: 4.2 M/S ➔
  </text>

  <!-- Title Badge -->
  <rect x="150" y="520" width="500" height="60" rx="18" fill="#030712" stroke="#f43f5e" stroke-width="2" filter="url(#neonGlow)"/>
  <text x="400" y="560" fill="#00f0ff" font-size="26" font-family="sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">
    SNIPER ELITE 3D: TACTICAL MARKSMAN
  </text>
</svg>
