<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d1f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pinkBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="amberBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpleBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Glowing 8x8 Grid Base -->
  <g transform="translate(240, 60)" filter="url(#neonGlow)">
    <rect width="320" height="320" rx="16" fill="#0f172a" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Grid Cells -->
  <g transform="translate(250, 70)">
    <!-- Cyan Blocks -->
    <rect x="0" y="0" width="34" height="34" rx="6" fill="url(#cyanBlock)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="38" y="0" width="34" height="34" rx="6" fill="url(#cyanBlock)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="76" y="0" width="34" height="34" rx="6" fill="url(#cyanBlock)" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Pink Blocks -->
    <rect x="152" y="76" width="34" height="34" rx="6" fill="url(#pinkBlock)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="152" y="114" width="34" height="34" rx="6" fill="url(#pinkBlock)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="190" y="114" width="34" height="34" rx="6" fill="url(#pinkBlock)" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Amber Blocks -->
    <rect x="76" y="190" width="34" height="34" rx="6" fill="url(#amberBlock)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="114" y="190" width="34" height="34" rx="6" fill="url(#amberBlock)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="152" y="190" width="34" height="34" rx="6" fill="url(#amberBlock)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="190" y="190" width="34" height="34" rx="6" fill="url(#amberBlock)" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Purple Blocks -->
    <rect x="0" y="228" width="34" height="34" rx="6" fill="url(#purpleBlock)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="38" y="228" width="34" height="34" rx="6" fill="url(#purpleBlock)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="0" y="266" width="34" height="34" rx="6" fill="url(#purpleBlock)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="38" y="266" width="34" height="34" rx="6" fill="url(#purpleBlock)" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Floating Blast Particles -->
  <g fill="#ffe600" filter="url(#neonGlow)">
    <circle cx="430" cy="180" r="4"/>
    <circle cx="460" cy="160" r="6"/>
    <circle cx="490" cy="190" r="3.5"/>
    <circle cx="390" cy="210" r="5"/>
  </g>

  <!-- Header Title -->
  <g transform="translate(400, 42)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="30" letter-spacing="3" filter="url(#neonGlow)">CYBER BLOCK BLAST DELUXE</text>
    <text x="0" y="20" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="4">8X8 GRID • COMBO STREAKS • HYPER CASUAL</text>
  </g>
</svg>
